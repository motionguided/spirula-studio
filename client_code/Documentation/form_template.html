<anvil-form layout="CP_Darkroom.Layouts.BaseLayout">
  <anvil-block slot="title">
    <anvil-component type="Label" name="heading" prop:role="h1" prop:text="Documentation"></anvil-component>
  </anvil-block>
  <anvil-block slot="actions">
    <anvil-component type="Button" name="home_button" prop:text="Machine1"></anvil-component>
  </anvil-block>
  <anvil-block slot="content">
    <anvil-component type="Label" name="intro" prop:role="lede" prop:text="A screen is a machine. This handbook says what that means here, and how this branch is laid out."></anvil-component>
    <anvil-flowpanel>
      <anvil-component type="Button" name="intro_button" prop:text="Machines and YAML"></anvil-component>
      <anvil-component type="Button" name="machine_button" prop:text="Machine1"></anvil-component>
      <anvil-component type="Button" name="branch_button" prop:text="This branch"></anvil-component>
    </anvil-flowpanel>
  </anvil-block>
</anvil-form>
